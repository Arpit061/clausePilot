services:
  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  # Plain PostgreSQL for the foundation milestone. pgvector will be added
  # in the retrieval milestone once the vector search design is settled.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clausepilot
    ports:
      - "5433:5432"
    volumes:
      - clausepilot_db_data:/var/lib/postgresql/data

volumes:
  clausepilot_db_data:
