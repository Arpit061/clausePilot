services:
  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  # PostgreSQL with the pgvector extension pre-installed, used for clause
  # embeddings / semantic search.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clausepilot
    ports:
      - "5433:5432"
    volumes:
      - clausepilot_db_data:/var/lib/postgresql/data

volumes:
  clausepilot_db_data:
